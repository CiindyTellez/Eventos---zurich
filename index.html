<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario de Eventos Zurich</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#203040}
main{max-width:1150px;margin:25px auto;padding:15px}
header,.calendar{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0001;margin-bottom:18px}
h1{margin:0 0 6px;color:#0b4f8a}
.sub{color:#667788}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button,select{padding:10px 13px;border:1px solid #ccd6e0;border-radius:9px;background:#fff;cursor:pointer;font-size:14px}
button{background:#0b4f8a;color:#fff}
#status{margin-top:12px;font-size:13px;color:#667788}
#status.error{color:#b42318}
.title{font-size:21px;font-weight:bold;text-transform:capitalize;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{background:#0b4f8a;color:#fff;text-align:center;padding:11px;font-weight:bold}
.day{min-height:125px;border:1px solid #e1e7ed;border-top:0;padding:8px;background:#fff}
.muted{background:#fafafa;color:#a7afb8}
.num{font-weight:bold;margin-bottom:7px}
.event{margin-top:6px;padding:7px;background:#e8f1fa;border-left:4px solid #0b4f8a;border-radius:6px;font-size:12px;line-height:1.35}
.event b{display:block;color:#0b4f8a;margin-bottom:3px}
.has-event{background:#e8f1fa}
.status-apartado{border-left-color:#f0a500}
.status-confirmado{border-left-color:#2e8b57}
.status-cancelado{border-left-color:#c62828}
.footer{font-size:12px;color:#667788;margin-top:14px}
@media(max-width:700px){
  main{margin:8px auto;padding:8px}
  header,.calendar{padding:13px}
  h1{font-size:22px}
  .day{min-height:95px;padding:5px}
  .event{font-size:10px;padding:5px}
  .dow{font-size:11px;padding:8px 3px}
}
</style>
</head>
<body>
<main>
<header>
<h1>Calendario de Eventos Zurich</h1>
<div class="sub">Los eventos se leen directamente de la pestaña <b>Eventos</b> de Google Sheets.</div>
<div class="controls">
<button onclick="changeMonth(-1)">‹ Mes anterior</button>
<button onclick="goToday()">Hoy</button>
<button onclick="changeMonth(1)">Mes siguiente ›</button>
<select id="month" onchange="selectMonth()"></select>
<select id="year" onchange="selectMonth()"></select>
<button onclick="loadEvents()">↻ Actualizar datos</button>
</div>
<div id="status">Cargando datos…</div>
</header>

<section class="calendar">
<div id="title" class="title"></div>
<div id="calendar" class="grid"></div>
<div class="footer">Fuente: Google Sheets · Pestaña Eventos · Columnas J:M. Al agregar una fecha y sus datos en la tabla, el evento aparecerá en el día correspondiente.</div>
</section>
</main>

<script>
const SHEET_ID="1yf084t74b-gowNTnsVLj0mJAdW9RXEax";
const GID="280662515";
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DAYS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
let events=[];
let view=new Date();

function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function key(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parseDate(value){
  let s=String(value||"").trim();
  if(!s) return null;

  // dd/mm/yyyy, dd-mm-yyyy
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);

  // yyyy-mm-dd
  m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);

  // Google sometimes returns Date(2026,7,20)
  m=s.match(/Date\((\d{4}),(\d{1,2}),(\d{1,2})\)/);
  if(m) return new Date(+m[1],+m[2],+m[3]);

  const d=new Date(s);
  return isNaN(d.getTime())?null:d;
}

function statusClass(status){
  const s=String(status||"").trim().toLowerCase();
  if(s.includes("apart")) return " status-apartado";
  if(s.includes("confirm")) return " status-confirmado";
  if(s.includes("cancel")) return " status-cancelado";
  return "";
}

function render(){
  document.getElementById("title").textContent=MONTHS[view.getMonth()]+" "+view.getFullYear();
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  DAYS.forEach(d=>{
    const el=document.createElement("div");
    el.className="dow";
    el.textContent=d;
    cal.appendChild(el);
  });

  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const start=new Date(first);
  start.setDate(1-((first.getDay()+6)%7));

  for(let i=0;i<42;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);

    const cell=document.createElement("div");
    cell.className="day"+(d.getMonth()!==view.getMonth()?" muted":"");

    const num=document.createElement("div");
    num.className="num";
    num.textContent=d.getDate();
    cell.appendChild(num);

    const dayEvents=events.filter(e=>e.date===key(d));
    if(dayEvents.length) cell.classList.add("has-event");

    dayEvents.forEach(e=>{
      const item=document.createElement("div");
      item.className="event"+statusClass(e.estatus);
      item.innerHTML=
        "<b>"+esc(e.responsable||"Evento")+"</b>"+
        (e.direccion?"📍 "+esc(e.direccion)+"<br>":"")+
        (e.estatus?"Estado: "+esc(e.estatus):"");
      cell.appendChild(item);
    });

    cal.appendChild(cell);
  }

  fillSelectors();
}

function fillSelectors(){
  document.getElementById("month").innerHTML=
    MONTHS.map((m,i)=>'<option value="'+i+'">'+m+'</option>').join("");

  const years=new Set([view.getFullYear()]);
  events.forEach(e=>years.add(+e.date.slice(0,4)));

  document.getElementById("year").innerHTML=
    [...years].sort((a,b)=>a-b).map(y=>'<option value="'+y+'">'+y+'</option>').join("");

  document.getElementById("month").value=view.getMonth();
  document.getElementById("year").value=view.getFullYear();
}

function changeMonth(n){
  view.setMonth(view.getMonth()+n);
  render();
}
function goToday(){
  const d=new Date();
  view=new Date(d.getFullYear(),d.getMonth(),1);
  render();
}
function selectMonth(){
  view=new Date(
    +document.getElementById("year").value,
    +document.getElementById("month").value,
    1
  );
  render();
}

/*
  Usamos Google Visualization (GViz) en lugar del CSV.
  Esto lee los valores mostrados por las fórmulas de Google Sheets.
  La fila 6 es el encabezado y las columnas J:M contienen:
  Fecha | Responsable de evento | Dirección | Estatus
*/
function loadEvents(){
  const status=document.getElementById("status");
  status.className="";
  status.textContent="Cargando datos desde Google Sheets…";

  const callback="zurichCallback_"+Date.now();

  window[callback]=function(response){
    try{
      if(!response || response.status!=="ok"){
        throw new Error("Google Sheets no devolvió los datos.");
      }

      const rows=(response.table && response.table.rows)||[];
      events=[];

      rows.forEach(row=>{
        const cells=row.c||[];
        const dateValue=cells[0] ? (cells[0].v || cells[0].f) : "";
        const responsable=cells[1] ? (cells[1].v || cells[1].f) : "";
        const direccion=cells[2] ? (cells[2].v || cells[2].f) : "";
        const estatus=cells[3] ? (cells[3].v || cells[3].f) : "";

        const d=parseDate(dateValue);
        if(d){
          events.push({
            date:key(d),
            responsable:responsable,
            direccion:direccion,
            estatus:estatus
          });
        }
      });

      status.textContent="✓ "+events.length+" evento(s) cargados desde Google Sheets.";
      render();
    }catch(err){
      status.className="error";
      status.textContent="⚠️ "+err.message;
      render();
    }finally{
      delete window[callback];
      const old=document.getElementById(callback);
      if(old) old.remove();
    }
  };

  const script=document.createElement("script");
  script.id=callback;
  script.src=
    "https://docs.google.com/spreadsheets/d/"+SHEET_ID+
    "/gviz/tq?gid="+GID+
    "&range=J6:M"+
    "&headers=1"+
    "&tqx=responseHandler:"+callback+
    "&t="+Date.now();

  script.onerror=function(){
    status.className="error";
    status.textContent="⚠️ No fue posible conectar con Google Sheets.";
    delete window[callback];
    script.remove();
  };

  document.body.appendChild(script);
}

render();
loadEvents();
</script>
</body>
</html>
